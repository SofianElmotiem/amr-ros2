controller_manager:
  ros__parameters:
    update_rate: 100

    forward_velocity_controller:
      type: forward_command_controller/ForwardCommandController

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

forward_velocity_controller:
  ros__parameters:
    joints:
      - first_wheel_joint
      - second_wheel_joint
      - third_wheel_joint
      - fourth_wheel_joint
    interface_name: velocity

arm_controller:
  ros__parameters:
    joints:
      - soulder_joint
      - upper_arm_joint
      - elbow_joint
      - lower_arm_joint
      - wrist_joint
      - gripper_joint
      - finger_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
